<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", system-ui, sans-serif; color: #111827; }
      .stage {
        width: 1080px; height: 1920px; position: relative;
        background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f3f4f6 70%);
        display: flex; align-items: center; justify-content: center;
      }
      .pill {
        position: absolute; top: 60px; left: 60px;
        background: #10b981; color: #fff;
        padding: 18px 32px; border-radius: 999px;
        font-weight: 800; font-size: 30px;
        box-shadow: 0 12px 28px rgba(5,150,105,0.35);
        z-index: 10;
      }
      .pill .num { background: #fff; color: #10b981; padding: 2px 12px; border-radius: 999px; margin-right: 12px; }

      /* Vertical/portrait browser mockup — fills the canvas */
      .browser {
        width: 960px; height: 1500px; background: #fff;
        border-radius: 28px; overflow: hidden;
        box-shadow: 0 30px 80px rgba(17,24,39,0.18), 0 0 0 1px #e5e7eb;
        position: relative;
        margin-top: 60px;
      }
      .topbar {
        height: 78px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb;
        display: flex; align-items: center; padding: 0 28px; gap: 22px;
      }
      .dots { display: flex; gap: 12px; }
      .dot { width: 18px; height: 18px; border-radius: 50%; }
      .dot.r { background: #ef4444; }
      .dot.y { background: #f59e0b; }
      .dot.g { background: #10b981; }
      .url {
        flex: 1; background: #fff; height: 46px; border-radius: 12px;
        border: 1px solid #e5e7eb;
        display: flex; align-items: center; padding: 0 20px;
        font-size: 22px; color: #374151;
      }
      .url .lock { color: #10b981; margin-right: 12px; font-weight: 700; }

      .content {
        padding: 80px 70px; display: flex; flex-direction: column; gap: 48px;
        height: calc(100% - 78px); position: relative;
      }
      .hero h1 {
        font-weight: 900; font-size: 72px; letter-spacing: -0.02em;
        color: #111827; margin-bottom: 18px; line-height: 1.05;
      }
      .hero p { font-size: 32px; color: #6b7280; line-height: 1.3; }
      .form {
        display: flex; flex-direction: column; gap: 32px;
        margin-top: 8px;
      }
      .field { display: flex; flex-direction: column; gap: 14px; }
      .field label { font-weight: 600; font-size: 26px; color: #374151; }
      .field .input {
        height: 86px; background: #fff; border: 1px solid #e5e7eb;
        border-radius: 14px; padding: 0 26px;
        display: flex; align-items: center;
        font-size: 30px; color: #111827;
      }
      .caret {
        display: inline-block; width: 3px; height: 36px;
        background: #10b981; margin-left: 3px;
        animation: blink 0.8s steps(1) infinite;
        vertical-align: middle;
      }
      @keyframes blink { 50% { opacity: 0; } }
      .submit {
        align-self: flex-start; margin-top: 16px;
        background: #10b981; color: #fff;
        padding: 28px 56px; border-radius: 16px;
        font-weight: 800; font-size: 34px;
        box-shadow: 0 14px 32px rgba(5,150,105,0.35);
        position: relative;
      }
      .submit-pulse {
        position: absolute; inset: -10px; border-radius: 22px;
        border: 4px solid #10b981; opacity: 0;
      }
      .cursor {
        position: absolute;
        width: 44px; height: 44px;
        pointer-events: none; z-index: 5;
        filter: drop-shadow(0 6px 12px rgba(17,24,39,0.30));
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="paso1" data-start="0" data-width="1080" data-height="1920">
      <div class="stage">
        <div class="pill"><span class="num">1</span>de 3 — Postula tu tienda</div>

        <div class="browser" id="p1-browser">
          <div class="topbar">
            <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
            <div class="url"><span class="lock">●</span>cashbak.cl/sell/aplicar</div>
          </div>
          <div class="content">
            <div class="hero">
              <h1>Postula tu tienda en CashBak</h1>
              <p>Súmate al marketplace en pocos minutos.</p>
            </div>
            <div class="form">
              <div class="field">
                <label>Nombre de la tienda</label>
                <div class="input"><span id="f1"></span></div>
              </div>
              <div class="field">
                <label>RUT empresa</label>
                <div class="input"><span id="f2"></span></div>
              </div>
              <div class="field">
                <label>Categoría</label>
                <div class="input"><span id="f3"></span></div>
              </div>
              <div class="field">
                <label>Email de contacto</label>
                <div class="input"><span id="f4"></span></div>
              </div>
            </div>
            <div class="submit" id="p1-submit">
              Enviar solicitud
              <span class="submit-pulse" id="p1-pulse"></span>
            </div>
          </div>

          <svg class="cursor" id="p1-cursor" viewBox="0 0 24 24">
            <path d="M3 2l7 18 2-7 7-2L3 2z" fill="#111827" stroke="#fff" stroke-width="1.4"/>
          </svg>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#p1-browser", { y: 40, scale: 0.97, opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.from(".pill", { x: -30, opacity: 0, duration: 0.3, ease: "power2.out" }, 0.1);

      // Cursor coords in browser space (960×1500).
      // Topbar 78. Content padding 80,70. Hero block ~250px. Form starts at y ≈ 78+80+250+48 = 456.
      // Each field block: label (32) + gap 14 + input (86) = 132 + gap 32 = 164 between fields.
      // Field input vertical centers (y): 456+32+14+43 = 545; +164 = 709; +164 = 873; +164 = 1037.
      // Submit center ≈ x:330, y:1230.
      gsap.set("#p1-cursor", { x: 480, y: 460, opacity: 0 });
      tl.to("#p1-cursor", { opacity: 1, duration: 0.2 }, 0.4);

      tl.to("#p1-cursor", { x: 140, y: 545, duration: 0.3, ease: "power2.inOut" }, 0.55);
      tl.call(() => typeText("f1", "Deportes Andes", 0.2), null, 0.85);

      tl.to("#p1-cursor", { x: 140, y: 709, duration: 0.32, ease: "power2.inOut" }, 1.1);
      tl.call(() => typeText("f2", "76.123.456-7", 0.2), null, 1.42);

      tl.to("#p1-cursor", { x: 140, y: 873, duration: 0.32, ease: "power2.inOut" }, 1.65);
      tl.call(() => typeText("f3", "Deportes", 0.15), null, 1.97);

      tl.to("#p1-cursor", { x: 140, y: 1037, duration: 0.32, ease: "power2.inOut" }, 2.15);
      tl.call(() => typeText("f4", "contacto@deportesandes.cl", 0.28), null, 2.47);

      tl.to("#p1-cursor", { x: 330, y: 1230, duration: 0.4, ease: "power2.inOut" }, 2.85);
      tl.to("#p1-submit", { scale: 1.05, duration: 0.18, yoyo: true, repeat: 1 }, 3.2);
      tl.fromTo("#p1-pulse",
        { opacity: 0.8, scale: 1 },
        { opacity: 0, scale: 1.25, duration: 0.85, ease: "power2.out" }, 3.2
      );

      function typeText(id, str, total) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = "";
        const caret = '<span class="caret"></span>';
        let i = 0;
        const dur = (typeof total === "number") ? total : 0.3;
        const step = (dur * 1000) / Math.max(str.length, 1);
        const tick = () => {
          if (i <= str.length) {
            el.innerHTML = str.slice(0, i) + caret;
            i++;
            setTimeout(tick, step);
          } else {
            el.innerHTML = str;
          }
        };
        tick();
      }

      window.__timelines["paso1"] = tl;
    </script>
  </body>
</html>
