<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", system-ui, sans-serif; color: #111827; }
      .stage {
        width: 1080px; height: 1920px; position: relative;
        background: radial-gradient(circle at 50% 40%, #ffffff 0%, #f3f4f6 80%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 0 40px;
      }
      .grid {
        display: flex; flex-direction: column; gap: 32px;
        margin-bottom: 80px;
      }
      .pcard {
        width: 760px; height: 220px; background: #fff; border: 1px solid #e5e7eb;
        border-radius: 18px; padding: 22px;
        display: flex; gap: 24px; align-items: center;
        box-shadow: 0 8px 28px rgba(17,24,39,0.06);
      }
      .pcard .img {
        flex: 0 0 176px;
        width: 176px; height: 176px; border-radius: 14px;
        background: #f9fafb; display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .pcard .img img {
        max-width: 92%; max-height: 92%; object-fit: contain;
      }
      .pcard .info {
        flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px;
      }
      .pcard .name { font-weight: 700; font-size: 30px; color: #111827; }
      .pcard .store { font-size: 22px; color: #6b7280; }
      .pcard .price {
        margin-top: auto; font-weight: 800; font-size: 40px;
        font-variant-numeric: tabular-nums; color: #111827;
      }
      .pointer {
        position: absolute;
        width: 64px; height: 64px;
        top: 0; left: 0;
        pointer-events: none;
        filter: drop-shadow(0 6px 14px rgba(17,24,39,0.35));
      }
      .pointer svg { width: 100%; height: 100%; }
      .ripple {
        position: absolute; top: 0; left: 0;
        width: 22px; height: 22px; border-radius: 50%;
        border: 3px solid #10b981; opacity: 0;
        pointer-events: none;
      }
      .caption {
        position: relative;
        font-weight: 800; font-size: 76px;
        color: #111827; letter-spacing: -0.02em;
        text-align: center;
        padding: 18px 32px;
        line-height: 1.1;
      }
      .caption .accent {
        color: #047857;
        position: relative;
        display: inline-block;
      }
      .caption .underline {
        position: absolute; left: 0; right: 0; bottom: -8px; height: 10px;
        background: linear-gradient(90deg, #a7f3d0 0%, #10b981 100%);
        border-radius: 999px;
        transform-origin: left center;
        transform: scaleX(0);
      }
      .caption .eyebrow {
        display: block;
        font-weight: 700; font-size: 26px; letter-spacing: 0.18em;
        color: #047857; text-transform: uppercase;
        margin-bottom: 18px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="contexto" data-start="0" data-width="1080" data-height="1920">
      <div class="stage" id="ctx-stage">
        <div class="grid" id="ctx-grid">
          <div class="pcard" id="card-a">
            <div class="img"><img src="../assets/audifonos-1.webp" alt="Audífonos" /></div>
            <div class="info">
              <div class="name">Audífonos Inalámbricos</div>
              <div class="store">Tienda A</div>
              <div class="price">$24.990</div>
            </div>
          </div>
          <div class="pcard" id="card-b">
            <div class="img"><img src="../assets/zapatillas-2.png" alt="Zapatillas Running" /></div>
            <div class="info">
              <div class="name">Zapatillas Running Pro</div>
              <div class="store">Tienda B</div>
              <div class="price">$39.990</div>
            </div>
          </div>
          <div class="pcard" id="card-c">
            <div class="img"><img src="../assets/reloj-3.png" alt="Reloj Deportivo" /></div>
            <div class="info">
              <div class="name">Reloj Deportivo GPS</div>
              <div class="store">Tienda C</div>
              <div class="price">$74.990</div>
            </div>
          </div>
        </div>

        <div class="pointer" id="pointer">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 3L5 19L9.5 14.5L12.5 21L15.5 19.5L12.5 13.5L19 13.5L5 3Z"
                  fill="#ffffff" stroke="#111827" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="ripple" id="ripple"></span>

        <p class="caption" id="ctx-caption">
          <span class="eyebrow">El reto</span>
          Llamar la atención <span class="accent">cuesta caro<span class="underline" id="ctx-underline"></span></span>.
        </p>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // cards entrance
      tl.from("#card-a", { y: 40, opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.from("#card-b", { y: 40, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.from("#card-c", { y: 40, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.3);

      // VERTICAL: cards stacked.
      // Stage 1080×1920, padding 40, grid centered.
      // Caption block (~ height 200) sits below grid with margin 80. Grid total height: 220*3 + 32*2 = 724.
      // Whole block (grid + caption + spacing) ~= 924. Centered vertically at 1920 → starts at y ≈ 498.
      // Card centers (y): 498 + 110 = 608, +252 = 860, +252 = 1112. x center = 540.
      // Pointer tip ≈ (14, 8) of 64px box → place pointer at (cx-14, cy-8).
      const A = { x: 540 - 14, y: 608 - 8 };
      const B = { x: 540 - 14, y: 860 - 8 };
      const C = { x: 540 - 14, y: 1112 - 8 };

      gsap.set("#pointer", { x: A.x - 200, y: A.y, opacity: 0 });
      gsap.set("#ripple", { x: 0, y: 0, opacity: 0, scale: 0.8 });

      tl.to("#pointer", { opacity: 1, duration: 0.3 }, 0.7);
      tl.to("#pointer", { x: A.x, y: A.y, duration: 0.6, ease: "power2.out" }, 0.7);

      tl.add(() => {
        gsap.set("#ripple", { x: A.x + 14, y: A.y + 8 });
      }, 1.3);
      tl.fromTo("#ripple",
        { opacity: 0.9, scale: 0.6 },
        { opacity: 0, scale: 2.4, duration: 0.6, ease: "power2.out" }, 1.3);
      tl.to("#card-a", { y: -8, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.3);

      tl.to("#pointer", { x: B.x, y: B.y, duration: 0.7, ease: "power2.inOut" }, 1.7);
      tl.add(() => {
        gsap.set("#ripple", { x: B.x + 14, y: B.y + 8 });
      }, 2.4);
      tl.fromTo("#ripple",
        { opacity: 0.9, scale: 0.6 },
        { opacity: 0, scale: 2.4, duration: 0.6, ease: "power2.out" }, 2.4);
      tl.to("#card-b", { y: -8, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.4);

      tl.to("#pointer", { x: C.x, y: C.y, duration: 0.7, ease: "power2.inOut" }, 2.8);
      tl.add(() => {
        gsap.set("#ripple", { x: C.x + 14, y: C.y + 8 });
      }, 3.5);
      tl.fromTo("#ripple",
        { opacity: 0.9, scale: 0.6 },
        { opacity: 0, scale: 2.4, duration: 0.6, ease: "power2.out" }, 3.5);
      tl.to("#card-c", { y: -8, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.5);

      tl.from("#ctx-caption", { y: 30, opacity: 0, duration: 0.6, ease: "power3.out" }, 3.2);
      tl.to("#ctx-underline", { scaleX: 1, duration: 0.7, ease: "power2.out" }, 3.7);

      tl.to("#pointer", { x: C.x + 240, y: C.y + 240, opacity: 0, duration: 0.8, ease: "power2.in" }, 4.2);

      tl.fromTo("#ctx-grid", { scale: 1.04 }, { scale: 1, duration: 6, ease: "power1.out" }, 0);

      window.__timelines["contexto"] = tl;
    </script>
  </body>
</html>
