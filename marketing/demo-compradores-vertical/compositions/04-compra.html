<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      [data-composition-id="compra"] { width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", system-ui, sans-serif; color: #111827; }

      [data-composition-id="compra"] .stage {
        width: 1080px; height: 1920px; position: relative;
        background:
          radial-gradient(ellipse 90% 50% at 50% 0%, rgba(16,185,129,0.10), transparent 60%),
          linear-gradient(180deg, #f9fafb 0% 18%, #ffffff 18% 100%);
        padding: 110px 70px 110px;
        display: flex; flex-direction: column; align-items: center;
      }

      [data-composition-id="compra"] .header-row {
        width: 100%;
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 28px;
      }
      [data-composition-id="compra"] .pill-paso {
        display: inline-flex; align-items: center; gap: 12px;
        padding: 14px 24px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        border-radius: 999px;
        font-weight: 800; font-size: 26px; letter-spacing: 0.06em;
        box-shadow: 0 12px 28px rgba(5,150,105,0.40);
      }
      [data-composition-id="compra"] .pill-paso .num {
        background: rgba(255,255,255,0.25); padding: 4px 10px; border-radius: 999px;
        font-weight: 900; font-size: 22px;
      }
      [data-composition-id="compra"] .url-pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 12px 22px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 999px;
        color: #6b7280;
        font-weight: 600; font-size: 22px;
        box-shadow: 0 6px 18px rgba(17,24,39,0.06);
      }
      [data-composition-id="compra"] .url-pill .lock { color: #10b981; font-size: 18px; }

      /* check seal */
      [data-composition-id="compra"] .check-wrap {
        width: 100%;
        display: flex; flex-direction: column; align-items: center;
        margin-top: 20px;
        margin-bottom: 28px;
      }
      [data-composition-id="compra"] .check-circle {
        width: 220px; height: 220px;
        border-radius: 999px;
        background: linear-gradient(135deg, #10b981, #059669);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 24px 64px rgba(5,150,105,0.45);
        position: relative;
      }
      [data-composition-id="compra"] .check-circle::after {
        content: ""; position: absolute; inset: -10px;
        border-radius: 999px;
        border: 2px solid rgba(16,185,129,0.35);
      }
      [data-composition-id="compra"] .check-circle svg {
        width: 130px; height: 130px;
        color: #fff;
      }
      [data-composition-id="compra"] .check-title {
        font-weight: 900; font-size: 76px; line-height: 1.02;
        letter-spacing: -0.025em; color: #111827;
        margin-top: 28px;
      }
      [data-composition-id="compra"] .check-title .green {
        background: linear-gradient(120deg, #10b981 0%, #059669 60%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      [data-composition-id="compra"] .check-sub {
        font-weight: 500; font-size: 30px; color: #6b7280;
        margin-top: 8px; text-align: center;
      }

      /* receipt card */
      [data-composition-id="compra"] .receipt {
        width: 100%;
        background: #fff; border: 1px solid #eef2f7; border-radius: 28px;
        padding: 30px 32px;
        box-shadow: 0 24px 56px rgba(17,24,39,0.10);
        display: flex; flex-direction: column;
        gap: 22px;
        margin-bottom: 26px;
      }

      [data-composition-id="compra"] .item-row {
        display: flex; align-items: center; gap: 22px;
      }
      [data-composition-id="compra"] .item-row .imgbox {
        flex: 0 0 130px;
        width: 130px; height: 130px; border-radius: 16px;
        background: linear-gradient(160deg, #f9fafb, #f3f4f6);
        display: flex; align-items: center; justify-content: center; overflow: hidden;
      }
      [data-composition-id="compra"] .item-row .imgbox img { max-width: 90%; max-height: 90%; object-fit: contain; }
      [data-composition-id="compra"] .item-row .name {
        font-weight: 700; font-size: 30px; color: #111827; margin-bottom: 4px;
      }
      [data-composition-id="compra"] .item-row .price {
        font-weight: 800; font-size: 30px; color: #111827;
        font-variant-numeric: tabular-nums;
      }

      [data-composition-id="compra"] .divider {
        height: 1px; background: #eef2f7; margin: 4px 0;
      }

      [data-composition-id="compra"] .label {
        font-weight: 700; font-size: 20px; letter-spacing: 0.18em;
        text-transform: uppercase; color: #059669;
        margin-bottom: 10px;
      }

      [data-composition-id="compra"] .event-row {
        display: flex; align-items: center; gap: 18px;
        padding: 18px 20px;
        background: linear-gradient(135deg, rgba(16,185,129,0.10), rgba(5,150,105,0.08));
        border: 1.5px dashed rgba(5,150,105,0.45);
        border-radius: 18px;
      }
      [data-composition-id="compra"] .event-row .ico {
        flex: 0 0 56px; width: 56px; height: 56px; border-radius: 12px;
        background: rgba(16,185,129,0.18);
        display: flex; align-items: center; justify-content: center;
        color: #059669;
      }
      [data-composition-id="compra"] .event-row .ico svg { width: 30px; height: 30px; }
      [data-composition-id="compra"] .event-row .ev-text {
        flex: 1 1 auto;
      }
      [data-composition-id="compra"] .event-row .ev-name {
        font-weight: 800; font-size: 30px; color: #111827; line-height: 1.15;
      }
      [data-composition-id="compra"] .event-row .ev-meta {
        font-size: 22px; color: #6b7280; margin-top: 2px;
      }
      [data-composition-id="compra"] .event-row .pct {
        font-weight: 900; font-size: 38px;
        color: #059669;
        font-variant-numeric: tabular-nums;
      }

      /* status timeline */
      [data-composition-id="compra"] .status {
        width: 100%;
        background: #fff; border: 1px solid #eef2f7; border-radius: 24px;
        padding: 26px 28px;
        box-shadow: 0 14px 32px rgba(17,24,39,0.06);
        display: flex; flex-direction: column; gap: 18px;
      }
      [data-composition-id="compra"] .status .row {
        display: flex; align-items: center; gap: 18px;
      }
      [data-composition-id="compra"] .status .dot {
        flex: 0 0 22px; width: 22px; height: 22px; border-radius: 999px;
        background: #d1fae5; border: 3px solid #10b981;
        position: relative;
      }
      [data-composition-id="compra"] .status .dot.done {
        background: #10b981;
      }
      [data-composition-id="compra"] .status .dot.pending {
        background: #ffffff; border-color: #d1d5db;
      }
      [data-composition-id="compra"] .status .label-row {
        display: flex; flex-direction: column;
      }
      [data-composition-id="compra"] .status .label-row .t {
        font-weight: 700; font-size: 26px; color: #111827;
      }
      [data-composition-id="compra"] .status .label-row .s {
        font-size: 20px; color: #6b7280; margin-top: 2px;
      }
      [data-composition-id="compra"] .status .row.pending .t { color: #9ca3af; }
      [data-composition-id="compra"] .status .row.pending .s { color: #d1d5db; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="compra" data-start="0" data-width="1080" data-height="1920">
      <div class="stage">
        <div class="header-row">
          <div class="pill-paso" id="cp-pill">
            <span class="num">3</span>
            <span>Compra lista</span>
          </div>
          <div class="url-pill" id="cp-url">
            <span class="lock">●</span>
            <span>cashbak.cl</span>
          </div>
        </div>

        <div class="check-wrap">
          <div class="check-circle" id="cp-check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4,12 10,18 20,7" />
            </svg>
          </div>
          <h1 class="check-title" id="cp-title">
            ¡Compra <span class="green">confirmada!</span>
          </h1>
          <p class="check-sub" id="cp-sub">Te enviamos los detalles a tu correo.</p>
        </div>

        <div class="receipt" id="cp-receipt">
          <div class="item-row" id="cp-item">
            <div class="imgbox"><img src="../assets/zapatillas-2.png" alt="Zapatillas" /></div>
            <div style="flex:1 1 auto; min-width: 0;">
              <div class="name">Zapatillas Running Pro</div>
              <div class="price">$39.990</div>
            </div>
          </div>

          <div class="divider"></div>

          <div>
            <div class="label">Tu evento</div>
            <div class="event-row" id="cp-event">
              <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></span>
              <div class="ev-text">
                <div class="ev-name">Chile le gana a Brasil</div>
                <div class="ev-meta">Hoy 20:00 · Estadio Nacional</div>
              </div>
              <div class="pct">100%</div>
            </div>
          </div>
        </div>

        <div class="status" id="cp-status">
          <div class="row" id="cp-st-1">
            <span class="dot done"></span>
            <div class="label-row"><span class="t">Pago confirmado</span><span class="s">Listo</span></div>
          </div>
          <div class="row" id="cp-st-2">
            <span class="dot done"></span>
            <div class="label-row"><span class="t">Producto en camino</span><span class="s">Llegará pronto</span></div>
          </div>
          <div class="row pending" id="cp-st-3">
            <span class="dot pending"></span>
            <div class="label-row"><span class="t">Tu CashBak</span><span class="s">Esperando el evento</span></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#cp-pill", { x: -60, opacity: 0 });
      gsap.set("#cp-url", { x: 60, opacity: 0 });
      gsap.set("#cp-check", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#cp-title", { y: 30, opacity: 0 });
      gsap.set("#cp-sub", { y: 20, opacity: 0 });
      gsap.set("#cp-receipt", { y: 40, opacity: 0, scale: 0.97, transformOrigin: "50% 0%" });
      gsap.set("#cp-status", { y: 30, opacity: 0 });

      // header
      tl.to("#cp-pill", { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.05);
      tl.to("#cp-url", { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.15);

      // check seal
      tl.to("#cp-check", { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.7)" }, 0.3);
      tl.to("#cp-check", { scale: 1.05, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "50% 50%" }, 1.0);
      tl.to("#cp-title", { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.7);
      tl.to("#cp-sub", { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.95);

      // receipt
      tl.to("#cp-receipt", { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 1.4);

      // status
      tl.to("#cp-status", { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 2.0);

      // emphasis on event row glow pulse
      tl.fromTo("#cp-event",
        { boxShadow: "0 0 0 rgba(5,150,105,0)" },
        { boxShadow: "0 0 28px rgba(5,150,105,0.25)", duration: 0.8, yoyo: true, repeat: 1, ease: "sine.inOut" },
        2.5
      );

      // ambient drift
      tl.fromTo("#cp-receipt", { y: 0 }, { y: -6, duration: 5, ease: "sine.inOut" }, 0);

      window.__timelines["compra"] = tl;
    </script>
  </body>
</html>
