<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      [data-composition-id="producto"] { width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", system-ui, sans-serif; color: #111827; }

      [data-composition-id="producto"] .stage {
        width: 1080px; height: 1920px; position: relative;
        background:
          radial-gradient(ellipse 90% 50% at 50% 0%, rgba(16,185,129,0.10), transparent 60%),
          linear-gradient(180deg, #f9fafb 0% 18%, #ffffff 18% 100%);
        padding: 110px 70px 110px;
        display: flex; flex-direction: column;
      }

      [data-composition-id="producto"] .header-row {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 28px;
      }
      [data-composition-id="producto"] .pill-paso {
        display: inline-flex; align-items: center; gap: 12px;
        padding: 14px 24px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        border-radius: 999px;
        font-weight: 800; font-size: 26px; letter-spacing: 0.06em;
        box-shadow: 0 12px 28px rgba(5,150,105,0.40);
      }
      [data-composition-id="producto"] .pill-paso .num {
        background: rgba(255,255,255,0.25); padding: 4px 10px; border-radius: 999px;
        font-weight: 900; font-size: 22px;
      }
      [data-composition-id="producto"] .url-pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 12px 22px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 999px;
        color: #6b7280;
        font-weight: 600; font-size: 22px;
        box-shadow: 0 6px 18px rgba(17,24,39,0.06);
      }
      [data-composition-id="producto"] .url-pill .lock { color: #10b981; font-size: 18px; }

      [data-composition-id="producto"] .h1 {
        font-weight: 900; font-size: 92px; line-height: 1.02;
        letter-spacing: -0.025em; color: #111827;
        margin-bottom: 12px;
      }
      [data-composition-id="producto"] .h1 .green {
        background: linear-gradient(120deg, #10b981 0%, #059669 60%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      [data-composition-id="producto"] .sub-h1 {
        font-weight: 500; font-size: 34px; line-height: 1.3;
        color: #6b7280;
        margin-bottom: 56px;
        max-width: 800px;
      }

      /* product grid 2x2 */
      [data-composition-id="producto"] .grid {
        display: grid; grid-template-columns: repeat(2, 1fr);
        gap: 28px;
        margin-top: 6px;
      }
      [data-composition-id="producto"] .pcard {
        background: #fff; border: 1px solid #eef2f7; border-radius: 26px;
        padding: 22px; display: flex; flex-direction: column; gap: 10px;
        box-shadow: 0 18px 38px rgba(17,24,39,0.06);
        position: relative; overflow: hidden;
        will-change: transform;
      }
      [data-composition-id="producto"] .pcard::after {
        content: ""; position: absolute; inset: 0;
        border-radius: 26px;
        background: linear-gradient(180deg, rgba(255,255,255,0) 60%, rgba(16,185,129,0.04) 100%);
        pointer-events: none;
      }
      [data-composition-id="producto"] .pcard .imgbox {
        width: 100%; height: 320px; border-radius: 18px;
        background: linear-gradient(160deg, #f9fafb, #f3f4f6);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        position: relative;
      }
      [data-composition-id="producto"] .pcard .imgbox img {
        max-width: 90%; max-height: 90%; object-fit: contain;
      }
      [data-composition-id="producto"] .pcard .name {
        font-weight: 700; font-size: 28px; color: #111827;
        line-height: 1.18;
        margin-top: 4px;
      }
      [data-composition-id="producto"] .pcard .price {
        font-weight: 800; font-size: 32px; color: #111827;
        font-variant-numeric: tabular-nums;
      }
      [data-composition-id="producto"] .pcard .badge {
        position: absolute; top: 18px; left: 18px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        padding: 8px 16px; border-radius: 999px;
        font-weight: 800; font-size: 20px;
        box-shadow: 0 8px 20px rgba(5,150,105,0.45);
        display: inline-flex; align-items: center; gap: 6px;
      }
      [data-composition-id="producto"] .pcard .badge::before {
        content: ""; width: 8px; height: 8px; border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 0 12px rgba(255,255,255,0.95);
      }
      /* hero ring */
      [data-composition-id="producto"] .pcard .ring {
        position: absolute; inset: -2px;
        border-radius: 28px;
        border: 0px solid #10b981;
        pointer-events: none;
        opacity: 0;
      }

      /* cursor (hand) — anchor at fingertip, GSAP x/y positions the click point directly */
      [data-composition-id="producto"] .cursor {
        position: absolute;
        top: 0; left: 0;
        width: 0; height: 0;
        z-index: 8;
        pointer-events: none;
        will-change: transform;
      }
      [data-composition-id="producto"] .cursor .hand-wrap {
        position: absolute;
        width: 80px; height: 80px;
        top: -3px;
        left: -32px;
        filter: drop-shadow(0 10px 22px rgba(0,0,0,0.42));
      }
      [data-composition-id="producto"] .cursor .hand {
        width: 80px; height: 80px; display: block;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
      [data-composition-id="producto"] .cursor .tap-ring {
        position: absolute;
        top: -55px;
        left: -55px;
        width: 110px;
        height: 110px;
        border-radius: 999px;
        background: rgba(16,185,129,0.32);
        border: 3px solid rgba(16,185,129,0.85);
        transform: scale(0);
        transform-origin: 50% 50%;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="producto" data-start="0" data-width="1080" data-height="1920">
      <div class="stage">
        <div class="header-row">
          <div class="pill-paso" id="pp-pill">
            <span class="num">1</span>
            <span>Elige producto</span>
          </div>
          <div class="url-pill" id="pp-url">
            <span class="lock">●</span>
            <span>cashbak.cl</span>
          </div>
        </div>

        <h1 class="h1" id="pp-h1">
          Cualquier producto.
          <span class="green">Con CashBak.</span>
        </h1>
        <p class="sub-h1" id="pp-sub">Zapatillas, audífonos, regalos. Lo que tú quieras.</p>

        <div class="grid">
          <div class="pcard hero" id="pc-1">
            <div class="ring" id="pc-1-ring"></div>
            <div class="badge">CashBak 100%</div>
            <div class="imgbox"><img src="../assets/zapatillas-2.png" alt="Zapatillas Running Pro" /></div>
            <div class="name">Zapatillas Running Pro</div>
            <div class="price">$39.990</div>
          </div>

          <div class="pcard" id="pc-2">
            <div class="badge">70%</div>
            <div class="imgbox"><img src="../assets/audifonos-1.webp" alt="Audífonos" /></div>
            <div class="name">Audífonos Pro</div>
            <div class="price">$29.990</div>
          </div>

          <div class="pcard" id="pc-3">
            <div class="badge">85%</div>
            <div class="imgbox"><img src="../assets/reloj-3.png" alt="Reloj" /></div>
            <div class="name">Reloj Sport</div>
            <div class="price">$49.990</div>
          </div>

          <div class="pcard" id="pc-4">
            <div class="badge">60%</div>
            <div class="imgbox"><img src="../assets/pelota-basket-1.webp" alt="Pelota" /></div>
            <div class="name">Pelota Basket</div>
            <div class="price">$14.990</div>
          </div>
        </div>

        <div class="cursor" id="pp-cursor">
          <span class="tap-ring"></span>
          <span class="hand-wrap">
            <img class="hand" src="../assets/puntero_mano.png" alt="cursor" />
          </span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#pp-pill", { x: -60, opacity: 0 });
      gsap.set("#pp-url", { x: 60, opacity: 0 });
      gsap.set("#pp-h1", { y: 36, opacity: 0 });
      gsap.set("#pp-sub", { y: 24, opacity: 0 });
      gsap.set(["#pc-1", "#pc-2", "#pc-3", "#pc-4"], { y: 60, opacity: 0, scale: 0.94, rotation: 2, transformOrigin: "50% 50%" });
      gsap.set("#pc-2", { rotation: -2 });
      gsap.set("#pc-3", { rotation: -1.5 });
      gsap.set("#pc-4", { rotation: 1.5 });
      gsap.set("#pp-cursor", { x: 940, y: 1680, opacity: 0 });
      gsap.set("#pp-cursor .tap-ring", { scale: 0, opacity: 0 });
      gsap.set("#pc-1-ring", { opacity: 0 });

      // Compute pc-1 layout center relative to .stage on demand.
      // Re-evaluated at tween start time via GSAP function values so any
      // font/layout settling is captured before the cursor flies.
      const __stage = document.querySelector('[data-composition-id="producto"] .stage');
      function __pc1Center() {
        const pc1 = document.getElementById("pc-1");
        if (!__stage || !pc1) return { x: 300, y: 720 };
        let el = pc1, ox = 0, oy = 0;
        while (el && el !== __stage) {
          ox += el.offsetLeft;
          oy += el.offsetTop;
          el = el.offsetParent;
        }
        return { x: ox + pc1.offsetWidth / 2, y: oy + pc1.offsetHeight / 2 };
      }

      // header in
      tl.to("#pp-pill", { x: 0, opacity: 1, duration: 0.6722, ease: "expo.out" }, 0.0611);
      tl.to("#pp-url", { x: 0, opacity: 1, duration: 0.6722, ease: "expo.out" }, 0.1833);
      tl.to("#pp-h1", { y: 0, opacity: 1, duration: 0.8556, ease: "power3.out" }, 0.3667);
      tl.to("#pp-sub", { y: 0, opacity: 1, duration: 0.6722, ease: "power2.out" }, 0.6722);

      // cards stagger with rotation correction (fluid feel)
      const cards = ["#pc-1", "#pc-2", "#pc-3", "#pc-4"];
      cards.forEach((sel, i) => {
        tl.to(sel,
          { y: 0, opacity: 1, scale: 1, rotation: 0, duration: 0.8556, ease: "back.out(1.2)" },
          0.75 + i * 0.10
        );
      });

      // hand flies in and lands on the hero card (pc-1 center, computed at tween start)
      tl.to("#pp-cursor", { opacity: 1, duration: 0.3056 }, 2.0778);
      tl.to("#pp-cursor", {
        x: () => __pc1Center().x,
        y: () => __pc1Center().y,
        duration: 1.2222,
        ease: "power3.inOut"
      }, 2.0778);

      // tap ring pulse exactly when the hand lands (click moment)
      tl.fromTo("#pp-cursor .tap-ring",
        { scale: 0, opacity: 0.9 },
        { scale: 2.6, opacity: 0, duration: 0.8556, ease: "power2.out" }, 3.3);

      // hand "press" micro-bounce
      tl.to("#pp-cursor .hand-wrap", { scale: 0.88, duration: 0.1467, ease: "power2.out", transformOrigin: "50% 0%" }, 3.3);
      tl.to("#pp-cursor .hand-wrap", { scale: 1, duration: 0.3422, ease: "back.out(2)", transformOrigin: "50% 0%", overwrite: "auto" }, 3.4711);

      // hero card responds to the click (slight delay for natural feel)
      tl.to("#pc-1", { scale: 1.045, duration: 0.55, ease: "power3.out", transformOrigin: "50% 50%" }, 3.3978);
      tl.to("#pc-1-ring", { opacity: 1, borderWidth: 4, duration: 0.4889, ease: "power2.out" }, 3.3978);
      tl.to("#pc-1", { y: -4, duration: 0.6722, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.7278);

      // continuous fluid drift across full 4.5s
      tl.fromTo(".grid", { y: 0 }, { y: -12, duration: 5.5, ease: "sine.inOut" }, 0.0);
      tl.fromTo("#pc-2", { rotation: 0 }, { rotation: 0.6, duration: 5.5, ease: "sine.inOut" }, 0.0);
      tl.fromTo("#pc-3", { rotation: 0 }, { rotation: -0.6, duration: 5.5, ease: "sine.inOut" }, 0.0);

      window.__timelines["producto"] = tl;
    </script>
  </body>
</html>
