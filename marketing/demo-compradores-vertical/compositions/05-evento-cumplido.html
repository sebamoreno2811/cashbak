<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      [data-composition-id="evcumplido"] { width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", system-ui, sans-serif; color: #ffffff; }

      [data-composition-id="evcumplido"] .stage {
        width: 1080px; height: 1920px; position: relative;
        background:
          radial-gradient(ellipse 80% 60% at 50% 30%, rgba(16,185,129,0.30), transparent 60%),
          linear-gradient(160deg, #052e1a 0%, #14532d 38%, #166534 70%, #059669 130%);
        padding: 130px 70px;
        display: flex; flex-direction: column; align-items: center;
      }
      [data-composition-id="evcumplido"] .blob-a {
        position: absolute; top: -260px; right: -260px;
        width: 1100px; height: 1100px;
        background: radial-gradient(circle, rgba(52,211,153,0.30), transparent 60%);
        will-change: transform;
      }
      [data-composition-id="evcumplido"] .blob-b {
        position: absolute; bottom: -240px; left: -240px;
        width: 900px; height: 900px;
        background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 65%);
        will-change: transform;
      }
      [data-composition-id="evcumplido"] .grid-overlay {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: radial-gradient(ellipse 70% 50% at 50% 50%, #000 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 50%, #000 30%, transparent 80%);
      }

      /* live tag */
      [data-composition-id="evcumplido"] .live-tag {
        position: relative; z-index: 3;
        display: inline-flex; align-items: center; gap: 14px;
        padding: 14px 28px;
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(167,243,208,0.35);
        backdrop-filter: blur(8px);
        border-radius: 999px;
        color: #d1fae5;
        font-weight: 800; font-size: 24px; letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 36px;
      }
      [data-composition-id="evcumplido"] .live-tag .dot {
        width: 12px; height: 12px; border-radius: 999px;
        background: #34d399; box-shadow: 0 0 18px rgba(52,211,153,0.95);
      }

      /* scoreboard */
      [data-composition-id="evcumplido"] .scoreboard {
        width: 920px;
        background: rgba(5,46,26,0.55);
        border: 1.5px solid rgba(167,243,208,0.20);
        backdrop-filter: blur(14px);
        border-radius: 32px;
        padding: 40px 36px;
        position: relative; z-index: 2;
        box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      }
      [data-composition-id="evcumplido"] .sb-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 26px;
      }
      [data-composition-id="evcumplido"] .sb-header .league {
        font-weight: 700; font-size: 22px; letter-spacing: 0.16em;
        text-transform: uppercase; color: #a7f3d0;
      }
      [data-composition-id="evcumplido"] .sb-header .final-pill {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 8px 16px; border-radius: 999px;
        background: rgba(16,185,129,0.20);
        border: 1px solid rgba(167,243,208,0.4);
        color: #d1fae5;
        font-weight: 800; font-size: 20px; letter-spacing: 0.14em;
      }

      [data-composition-id="evcumplido"] .teams {
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        gap: 18px;
      }
      [data-composition-id="evcumplido"] .team {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
      }
      [data-composition-id="evcumplido"] .flag {
        width: 130px; height: 130px; border-radius: 999px;
        background: #fff;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 28px rgba(0,0,0,0.35);
        font-size: 78px;
        line-height: 1;
      }
      [data-composition-id="evcumplido"] .flag.cl {
        background: linear-gradient(180deg, #fff 0% 50%, #d52b1e 50% 100%);
        position: relative;
        overflow: hidden;
      }
      [data-composition-id="evcumplido"] .flag.cl::before {
        content: ""; position: absolute; left: 0; top: 0;
        width: 50%; height: 50%; background: #0033a0;
      }
      [data-composition-id="evcumplido"] .flag.cl::after {
        content: "★"; position: absolute; left: 14%; top: 8%;
        color: #fff; font-size: 38px; line-height: 1;
      }
      [data-composition-id="evcumplido"] .flag.br {
        background: #009b3a;
        position: relative;
      }
      [data-composition-id="evcumplido"] .flag.br::before {
        content: ""; position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 70%; height: 50%;
        background: #ffd700;
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      }
      [data-composition-id="evcumplido"] .flag.br::after {
        content: ""; position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 36px; height: 36px; border-radius: 999px;
        background: #002776;
      }
      [data-composition-id="evcumplido"] .team-name {
        font-weight: 800; font-size: 32px; color: #ffffff;
        letter-spacing: -0.005em;
      }

      [data-composition-id="evcumplido"] .score {
        display: flex; align-items: center; gap: 26px;
        padding: 0 6px;
      }
      [data-composition-id="evcumplido"] .digit {
        font-weight: 900; font-size: 168px; line-height: 1;
        color: #ffffff;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        text-shadow: 0 8px 28px rgba(0,0,0,0.45);
      }
      [data-composition-id="evcumplido"] .digit.cl {
        background: linear-gradient(180deg, #ffffff 0%, #d1fae5 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      [data-composition-id="evcumplido"] .dash {
        font-weight: 900; font-size: 110px; color: rgba(167,243,208,0.55);
        line-height: 1;
      }

      /* event linked card (selected bet style) */
      [data-composition-id="evcumplido"] .bet-card {
        margin-top: 36px;
        width: 920px;
        position: relative; z-index: 2;
        display: flex; align-items: center; gap: 22px;
        padding: 26px 30px;
        background: linear-gradient(135deg, #10b981, #059669);
        border-radius: 22px;
        box-shadow: 0 22px 48px rgba(5,150,105,0.45);
        color: #fff;
      }
      [data-composition-id="evcumplido"] .bet-card .ico {
        flex: 0 0 64px; width: 64px; height: 64px; border-radius: 14px;
        background: rgba(255,255,255,0.22);
        display: flex; align-items: center; justify-content: center;
        color: #fff;
      }
      [data-composition-id="evcumplido"] .bet-card .ico svg { width: 34px; height: 34px; }
      [data-composition-id="evcumplido"] .bet-card .b-name {
        flex: 1 1 auto; font-weight: 800; font-size: 30px; line-height: 1.15;
      }
      [data-composition-id="evcumplido"] .bet-card .check {
        width: 56px; height: 56px; border-radius: 999px;
        background: #ffffff;
        display: flex; align-items: center; justify-content: center;
        color: #059669;
      }
      [data-composition-id="evcumplido"] .bet-card .check svg { width: 32px; height: 32px; }

      /* result message */
      [data-composition-id="evcumplido"] .result-msg {
        margin-top: 38px;
        text-align: center;
        position: relative; z-index: 2;
      }
      [data-composition-id="evcumplido"] .result-msg .top {
        font-weight: 800; font-size: 36px; letter-spacing: 0.06em;
        color: #a7f3d0; text-transform: uppercase;
        margin-bottom: 6px;
      }
      [data-composition-id="evcumplido"] .result-msg .h1 {
        font-weight: 900; font-size: 80px; line-height: 1.0;
        letter-spacing: -0.025em;
        background: linear-gradient(180deg, #ffffff 0%, #d1fae5 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* burst */
      [data-composition-id="evcumplido"] .burst {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 1;
      }
      [data-composition-id="evcumplido"] .burst .ray {
        position: absolute;
        top: 50%; left: 50%;
        width: 4px; height: 220px;
        background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0));
        transform-origin: 50% 0%;
        margin-top: 0;
        margin-left: -2px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="evcumplido" data-start="0" data-width="1080" data-height="1920">
      <div class="stage">
        <div class="blob-a" id="ec-blob-a"></div>
        <div class="blob-b" id="ec-blob-b"></div>
        <div class="grid-overlay" id="ec-grid"></div>

        <div class="burst" id="ec-burst">
          <div class="ray" style="transform: translate(-50%, -50%) rotate(0deg);"></div>
          <div class="ray" style="transform: translate(-50%, -50%) rotate(45deg);"></div>
          <div class="ray" style="transform: translate(-50%, -50%) rotate(90deg);"></div>
          <div class="ray" style="transform: translate(-50%, -50%) rotate(135deg);"></div>
          <div class="ray" style="transform: translate(-50%, -50%) rotate(180deg);"></div>
          <div class="ray" style="transform: translate(-50%, -50%) rotate(225deg);"></div>
          <div class="ray" style="transform: translate(-50%, -50%) rotate(270deg);"></div>
          <div class="ray" style="transform: translate(-50%, -50%) rotate(315deg);"></div>
        </div>

        <div class="live-tag" id="ec-live">
          <span class="dot"></span>
          <span>Final del partido</span>
        </div>

        <div class="scoreboard" id="ec-sb">
          <div class="sb-header">
            <span class="league">Eliminatorias</span>
            <span class="final-pill">90' · Final</span>
          </div>
          <div class="teams">
            <div class="team" id="ec-team-cl">
              <div class="flag cl"></div>
              <div class="team-name">Chile</div>
            </div>
            <div class="score">
              <span class="digit cl" id="ec-d1">2</span>
              <span class="dash">–</span>
              <span class="digit" id="ec-d2">1</span>
            </div>
            <div class="team" id="ec-team-br">
              <div class="flag br"></div>
              <div class="team-name">Brasil</div>
            </div>
          </div>
        </div>

        <div class="bet-card" id="ec-bet">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></span>
          <span class="b-name">Chile le gana a Brasil</span>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,12 10,18 20,7" /></svg></span>
        </div>

        <div class="result-msg" id="ec-msg">
          <div class="top">Tu evento se cumplió</div>
          <div class="h1">¡Recibirás tu Cashbak!</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#ec-grid", { opacity: 0 });
      gsap.set("#ec-live", { y: -30, opacity: 0 });
      gsap.set("#ec-sb", { y: 50, opacity: 0, scale: 0.96, transformOrigin: "50% 50%" });
      gsap.set("#ec-d1", { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#ec-d2", { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#ec-bet", { y: 40, opacity: 0, scale: 0.97, transformOrigin: "50% 50%" });
      gsap.set("#ec-msg", { y: 30, opacity: 0 });
      gsap.set("#ec-burst .ray", { scaleY: 0, opacity: 0, transformOrigin: "50% 0%" });

      // grid in
      tl.to("#ec-grid", { opacity: 1, duration: 1.44, ease: "power1.out" }, 0.0);

      // live tag
      tl.to("#ec-live", { y: 0, opacity: 1, duration: 0.66, ease: "expo.out" }, 0.24);

      // scoreboard frame
      tl.to("#ec-sb", { y: 0, opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 0.6);

      // brasil score in first
      tl.to("#ec-d2", { scale: 1, opacity: 1, duration: 0.66, ease: "back.out(1.7)" }, 1.2);

      // chile score in last with emphasis (the winning goal)
      tl.to("#ec-d1", { scale: 1.2, opacity: 1, duration: 0.72, ease: "back.out(2)" }, 1.8);
      tl.to("#ec-d1", { scale: 1, duration: 0.48, ease: "power2.out" }, 2.52);

      // burst rays
      tl.to("#ec-burst .ray", {
        scaleY: 1, opacity: 1, duration: 0.6, ease: "power3.out",
        stagger: { each: 0.03, from: "random" }
      }, 2.04);
      tl.to("#ec-burst .ray", { opacity: 0, duration: 0.84, ease: "power2.in" }, 2.88);

      // bet card slides in (recall from beat 3)
      tl.to("#ec-bet", { y: 0, opacity: 1, scale: 1, duration: 0.78, ease: "back.out(1.4)" }, 3.0);
      tl.to("#ec-bet", { scale: 1.03, duration: 0.48, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "50% 50%" }, 3.84);

      // result message
      tl.to("#ec-msg", { y: 0, opacity: 1, duration: 0.84, ease: "expo.out" }, 4.08);

      // ambient drift
      tl.fromTo("#ec-blob-a", { x: 0, y: 0 }, { x: -40, y: 30, duration: 6.0, ease: "sine.inOut" }, 0.0);
      tl.fromTo("#ec-blob-b", { x: 0, y: 0 }, { x: 30, y: -20, duration: 6.0, ease: "sine.inOut" }, 0.0);
      tl.fromTo(".stage", { scale: 1 }, { scale: 1.025, duration: 6.0, ease: "power1.inOut" }, 0.0);

      window.__timelines["evcumplido"] = tl;
    </script>
  </body>
</html>
