<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>CashBak — Demo para compradores (vertical)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32" data-width="1080" data-height="1920">
      <!-- Beat 1 — Hook (0–4s) -->
      <div class="clip" data-composition-id="hook" data-composition-src="compositions/01-hook.html" data-start="0" data-duration="4" data-track-index="0" style="z-index: 1"></div>

      <!-- Beat 2 — Elige producto (4–8.5s) -->
      <div class="clip" data-composition-id="producto" data-composition-src="compositions/02-elige-producto.html" data-start="4" data-duration="4.5" data-track-index="0" style="z-index: 1"></div>

      <!-- Beat 3 — Elige evento (8.5–14s) -->
      <div class="clip" data-composition-id="evento" data-composition-src="compositions/03-elige-evento.html" data-start="8.5" data-duration="5.5" data-track-index="0" style="z-index: 1"></div>

      <!-- Beat 4 — Compra confirmada (14–19s) -->
      <div class="clip" data-composition-id="compra" data-composition-src="compositions/04-compra.html" data-start="14" data-duration="5" data-track-index="0" style="z-index: 1"></div>

      <!-- Beat 5 — Evento cumplido (19–24s) -->
      <div class="clip" data-composition-id="evcumplido" data-composition-src="compositions/05-evento-cumplido.html" data-start="19" data-duration="5" data-track-index="0" style="z-index: 1"></div>

      <!-- Beat 6 — Cashbak recibido (24–28.5s) -->
      <div class="clip" data-composition-id="cashbak" data-composition-src="compositions/06-cashbak-recibido.html" data-start="24" data-duration="4.5" data-track-index="0" style="z-index: 1"></div>

      <!-- Beat 7 — Cierre (28.5–32s) -->
      <div class="clip" data-composition-id="cierre" data-composition-src="compositions/07-cierre.html" data-start="28.5" data-duration="3.5" data-track-index="0" style="z-index: 1"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
